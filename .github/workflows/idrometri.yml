name: Aggiorna letture idrometri ARPA

on:
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti (GitHub può ritardare di qualche minuto)
  workflow_dispatch:          # avvio manuale da Actions > "Run workflow"

permissions:
  contents: write

concurrency:
  group: idrometri
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica letture ARPA
        run: python3 scripts/aggiorna_idrometri.py
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/idrometri.json
          if git diff --cached --quiet; then echo "Nessuna variazione"; exit 0; fi
          git commit -m "Letture idrometri ARPA $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
